{% extends "base.html" %}
{% block titulo %}Login{% endblock titulo %}

{% block contenido %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <div class="card shadow-lg border-0">
                <div class="card-body">

                    <h3 class="text-center mb-4">Iniciar Sesión</h3>

                    <form action="{% url 'login' %}" method="POST">
                        {% csrf_token %}

                        <!-- Username -->
                        <div class="mb-3">
                            <label for="{{ formulario.username.id_for_label }}" class="form-label">
                                Usuario
                            </label>
                            {{ formulario.username }}
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="{{ formulario.password.id_for_label }}" class="form-label">
                                Contraseña
                            </label>
                            {{ formulario.password }}
                        </div>

                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-primary">
                                Ingresar
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock contenido %}
